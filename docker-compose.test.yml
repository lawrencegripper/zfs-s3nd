services:
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs

  create-bucket:
    image: amazon/aws-cli:latest
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do sleep 1; done &&
      aws --endpoint-url http://rustfs:9000 s3 mb s3://zfs-s3nd-backups || true
      "

  zfs-roundtrip:
    build:
      context: .
      dockerfile: Dockerfile.zfs-fuse
    depends_on:
      - rustfs
      - create-bucket
    working_dir: /src
    environment:
      SKIP_COMPOSE: "1"
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: zfs-s3nd-backups
      S3_ACCESS_KEY_ID: rustfsadmin
      S3_SECRET_ACCESS_KEY: rustfsadmin
      S3_FORCE_PATH_STYLE: "true"
      STORAGE_ENCRYPTION_KEY: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - .:/src
    command: ./scripts/test-zfs-ssh-roundtrip.sh

  test-runner:
    image: golang:1.26-bookworm
    depends_on:
      - rustfs
      - create-bucket
    working_dir: /src
    environment:
      RUN_S3_TESTS: "1"
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: zfs-s3nd-backups
      S3_ACCESS_KEY_ID: rustfsadmin
      S3_SECRET_ACCESS_KEY: rustfsadmin
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - .:/src
    command: go test ./test/integration/...

  app:
    build: .
    depends_on:
      - rustfs
      - create-bucket
    environment:
      DATABASE_PATH: /data/catalog.db
      HTTP_PORT: 3000
      SSH_PORT: 2222
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: zfs-s3nd-backups
      S3_ACCESS_KEY_ID: rustfsadmin
      S3_SECRET_ACCESS_KEY: rustfsadmin
      S3_FORCE_PATH_STYLE: "true"
      STORAGE_ENCRYPTION_KEY: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
    ports:
      - "3000:3000"
      - "2222:2222"
    volumes:
      - app-data:/data

volumes:
  app-data:
  rustfs-data:
  rustfs-logs:
